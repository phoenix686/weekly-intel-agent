name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q -m "not live" --ignore=tests/test_village_store_roundtrip.py --ignore=tests/test_ingest_bookmarks_gating.py
      - run: uv run python -m eval.validate_datasets
      - run: uv run python -m eval.run_smoke_gates
      - run: uv run python -m harbor.run_tasks
