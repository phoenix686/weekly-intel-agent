name: Daily Digest

on:
  schedule:
    # 05:07 UTC = 10:37 IST, same UTC calendar day -- no day-boundary
    # crossing (2026-07-28 fix). The prior 22:00 UTC scheme delivered on
    # the NEXT IST calendar day, which required converting each UTC
    # weekday to its IST equivalent just to figure out which day to
    # exclude -- real complexity that turned out to be unnecessary.
    # Reverted to same-day delivery (matching the pre-2026-07-26 schedule,
    # just at a different time and off the round hour): 05:07 UTC lands on
    # the same IST day directly, so excluding Saturday here means exactly
    # what it says, no UTC/IST offset math needed.
    #
    # Abandoned 22:00 UTC because two consecutive scheduled runs were
    # silently missed at that slot (Sunday 2026-07-26 and Monday
    # 2026-07-27) -- investigation ruled out YAML syntax, branch
    # placement, workflow Active status, and concurrency/queue issues,
    # all confirmed clean via gh CLI. Leading suspect: GitHub's documented
    # tendency to delay/drop scheduled triggers at the start of every
    # hour under load. 05:07 is deliberately off the round hour.
    #
    # Saturday excluded (day-of-week 0-5 = Sun-Fri) for the same original
    # reason as before: the weekly pipeline's own discovery subgraph
    # (saturday.yml, 23:00 UTC Friday -> 04:30 IST Saturday) already
    # covers that day.
    - cron: "7 5 * * 0-5"
  workflow_dispatch:

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      DB_URI: ${{ secrets.DB_URI }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Same fix as saturday.yml, same underlying reason: actions/cache@v4's
      # save only runs as a POST step, which is skipped entirely if the job
      # is cancelled by timeout-minutes rather than reaching a normal
      # completion. Explicit restore/save sub-actions instead, with save
      # placed right after the cache is actually populated, before the
      # long-running main step.
      - name: Restore pip cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Save pip cache
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Run daily digest
        # Output tee'd to a file (2026-07-19) so it can be uploaded as a
        # real downloadable artifact below -- see saturday.yml for the full
        # reasoning (pipefail is on by default for GH Actions bash steps,
        # so a real failure still fails this step despite the pipe).
        run: python scripts/run_daily.py 2>&1 | tee daily_run.log

      - name: Upload daily run log
        # if: always() -- see saturday.yml for the full reasoning (a real
        # ~5-minute cancellation grace period should let this still
        # capture a partial log from a timed-out run, unlike
        # actions/cache's save POST-step) -- NOT YET independently
        # confirmed against a real triggered run of this workflow.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-run-log-${{ github.run_id }}
          path: daily_run.log
          retention-days: 14

      # Same mechanism as saturday.yml: discovery/parsers/rss_common.py's
      # fetch_rss_feed() dumps the raw response body to logs/parse_errors/
      # on an XML ParseError (shared code, used by both daily and Saturday
      # runs) -- this was added to saturday.yml but not here, and the first
      # real occurrence since (MarkTechPost, 2026-07-20 daily run) was
      # missed as a result: the dump happened on the runner but was never
      # uploaded, so it was lost when the runner was destroyed. Backfilling
      # the same check-then-upload steps here so the next occurrence is
      # actually captured.
      - name: Check for RSS parse-error dumps
        id: check_parse_errors
        if: always()
        run: |
          if [ -d logs/parse_errors ] && [ -n "$(ls -A logs/parse_errors 2>/dev/null)" ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload RSS parse-error dumps
        if: always() && steps.check_parse_errors.outputs.has_files == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rss-parse-errors-${{ github.run_id }}
          path: logs/parse_errors/
          retention-days: 14
