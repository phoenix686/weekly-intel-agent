name: Daily Digest

on:
  schedule:
    # 02:30 UTC = 08:00 IST, Monday-Saturday. Sunday is skipped entirely --
    # the Sunday workflow's discovery subgraph already covers that day.
    - cron: "30 2 * * 1-6"
  workflow_dispatch:

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      DB_URI: ${{ secrets.DB_URI }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Same fix as sunday.yml, same underlying reason: actions/cache@v4's
      # save only runs as a POST step, which is skipped entirely if the job
      # is cancelled by timeout-minutes rather than reaching a normal
      # completion. Explicit restore/save sub-actions instead, with save
      # placed right after the cache is actually populated, before the
      # long-running main step.
      - name: Restore pip cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Restore HuggingFace model weights cache (all-MiniLM-L6-v2)
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-all-MiniLM-L6-v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Warm up local embedding model (populates the HuggingFace cache before the long-running step)
        run: python -c "from discovery.embeddings import _get_model; _get_model()"

      - name: Save pip cache
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Save HuggingFace model weights cache
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-all-MiniLM-L6-v2

      - name: Run daily digest
        run: python scripts/run_daily.py
