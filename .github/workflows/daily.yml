name: Daily Digest

on:
  schedule:
    # 02:30 UTC = 08:00 IST, Monday-Saturday. Sunday is skipped entirely --
    # the Sunday workflow's discovery subgraph already covers that day.
    - cron: "30 2 * * 1-6"
  workflow_dispatch:

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      DB_URI: ${{ secrets.DB_URI }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Same fix as sunday.yml, same underlying reason: actions/cache@v4's
      # save only runs as a POST step, which is skipped entirely if the job
      # is cancelled by timeout-minutes rather than reaching a normal
      # completion. Explicit restore/save sub-actions instead, with save
      # placed right after the cache is actually populated, before the
      # long-running main step.
      - name: Restore pip cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Restore HuggingFace model weights cache (all-MiniLM-L6-v2)
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-all-MiniLM-L6-v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Warm up local embedding model (populates the HuggingFace cache before the long-running step)
        run: python -c "from discovery.embeddings import _get_model; _get_model()"

      - name: Save pip cache
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Save HuggingFace model weights cache
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-all-MiniLM-L6-v2

      - name: Run daily digest
        # HF_HUB_OFFLINE=1 only on this step, not the warm-up step above --
        # see sunday.yml for the full reasoning and real local verification
        # (model construction time 6.58s -> 0.92s, 86% reduction, no
        # silent fallback).
        #
        # Output tee'd to a file (2026-07-19) so it can be uploaded as a
        # real downloadable artifact below -- see sunday.yml for the full
        # reasoning (pipefail is on by default for GH Actions bash steps,
        # so a real failure still fails this step despite the pipe).
        run: python scripts/run_daily.py 2>&1 | tee daily_run.log
        env:
          HF_HUB_OFFLINE: "1"

      - name: Upload daily run log
        # if: always() -- see sunday.yml for the full reasoning (a real
        # ~5-minute cancellation grace period should let this still
        # capture a partial log from a timed-out run, unlike
        # actions/cache's save POST-step) -- NOT YET independently
        # confirmed against a real triggered run of this workflow.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-run-log-${{ github.run_id }}
          path: daily_run.log
          retention-days: 14
