name: Daily Digest

on:
  schedule:
    # 22:00 UTC = 03:30 IST, every day (2026-07-26 timing fix -- the prior
    # 01:30 UTC (07:00 IST) trigger was observed actually delivering
    # around 10:30 IST, a ~3.5h GitHub-side scheduling lag; retargeted
    # earlier to land close to the real intended 07:00 IST delivery
    # time). Day-of-week restriction removed per this fix's explicit
    # spec -- flagged, not silently decided: the removed Mon-Sat/no-
    # Sunday restriction existed because the weekly pipeline's own
    # discovery subgraph already covered that one day; once the weekly
    # pipeline itself moves to a Friday trigger/Saturday delivery
    # (this same fix's Phase 2), that original rationale would point at
    # excluding Saturday, not at no exclusion at all. Implemented
    # exactly as specified for Phase 1; worth revisiting once Phase 2
    # lands.
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      DB_URI: ${{ secrets.DB_URI }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Same fix as sunday.yml, same underlying reason: actions/cache@v4's
      # save only runs as a POST step, which is skipped entirely if the job
      # is cancelled by timeout-minutes rather than reaching a normal
      # completion. Explicit restore/save sub-actions instead, with save
      # placed right after the cache is actually populated, before the
      # long-running main step.
      - name: Restore pip cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Save pip cache
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Run daily digest
        # Output tee'd to a file (2026-07-19) so it can be uploaded as a
        # real downloadable artifact below -- see sunday.yml for the full
        # reasoning (pipefail is on by default for GH Actions bash steps,
        # so a real failure still fails this step despite the pipe).
        run: python scripts/run_daily.py 2>&1 | tee daily_run.log

      - name: Upload daily run log
        # if: always() -- see sunday.yml for the full reasoning (a real
        # ~5-minute cancellation grace period should let this still
        # capture a partial log from a timed-out run, unlike
        # actions/cache's save POST-step) -- NOT YET independently
        # confirmed against a real triggered run of this workflow.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-run-log-${{ github.run_id }}
          path: daily_run.log
          retention-days: 14

      # Same mechanism as sunday.yml: discovery/parsers/rss_common.py's
      # fetch_rss_feed() dumps the raw response body to logs/parse_errors/
      # on an XML ParseError (shared code, used by both daily and Sunday
      # runs) -- this was added to sunday.yml but not here, and the first
      # real occurrence since (MarkTechPost, 2026-07-20 daily run) was
      # missed as a result: the dump happened on the runner but was never
      # uploaded, so it was lost when the runner was destroyed. Backfilling
      # the same check-then-upload steps here so the next occurrence is
      # actually captured.
      - name: Check for RSS parse-error dumps
        id: check_parse_errors
        if: always()
        run: |
          if [ -d logs/parse_errors ] && [ -n "$(ls -A logs/parse_errors 2>/dev/null)" ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload RSS parse-error dumps
        if: always() && steps.check_parse_errors.outputs.has_files == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rss-parse-errors-${{ github.run_id }}
          path: logs/parse_errors/
          retention-days: 14
