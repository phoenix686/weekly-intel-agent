name: Saturday Pipeline

on:
  schedule:
    # 05:07 UTC Saturday = 10:37 IST Saturday, same UTC calendar day --
    # no day-boundary crossing (2026-07-28 fix, the same preventive fix
    # applied to daily.yml's cron). The prior 23:00 UTC Friday scheme
    # fired on one UTC calendar day to deliver on the next IST calendar
    # day (04:30 IST Saturday) -- the same unnecessary boundary-crossing
    # complexity daily.yml's old 22:00 UTC cron had. Firing directly on
    # Saturday UTC instead means "Saturday" in this file's day-of-week
    # field means exactly what it says, no UTC/IST offset math required.
    #
    # This slot itself was never confirmed to have dropped a run the way
    # daily.yml's 22:00 UTC slot did (two silently missed runs, Sunday
    # 2026-07-26 and Monday 2026-07-27, investigated and root-caused to
    # that round-hour slot) -- this workflow's Friday 23:00 UTC cron
    # hadn't yet reached its first occurrence since the 2026-07-26
    # retiming fix (next Friday was 2026-07-31) at the time that
    # investigation happened, so there was no data either way for this
    # file specifically. Applying the same fix here proactively anyway:
    # the identical suspects apply (a round-hour 23:00 UTC slot sits in
    # GitHub's documented high-load window; the same boundary-crossing
    # scheme), and there's no reason to wait for a real miss on this
    # workflow to confirm a risk already identified on its sibling.
    #
    # 05:07 UTC deliberately matches daily.yml's own new cron -- same
    # off-round-hour time, just restricted to Saturday (day-of-week 6)
    # instead of daily's Sunday-Friday (0-5), so the two workflows stay
    # mutually exclusive by day and never compete for the same slot.
    # Delivery DAY is unchanged (still Saturday IST, matching this
    # workflow's name and the sunday/ -> saturday/ rename); only the
    # trigger mechanism changed.
    - cron: "7 5 * * 6"
  workflow_dispatch:

concurrency:
  group: saturday-pipeline
  cancel-in-progress: false

jobs:
  run-saturday:
    runs-on: ubuntu-latest
    # The interrupt() approval gate does NOT keep this job running -- each
    # proposal pauses on its own dedicated checkpointer thread in Postgres,
    # and the parent graph (this job) completes normally once every
    # proposal has been sent, regardless of whether any are still pending
    # approval. Resuming a paused proposal happens later, in a separate
    # process, via telegram/polling.py's poll_once() -- not by this job
    # staying alive. This is a safety net against a genuine hang, not a
    # wait for Telegram replies.
    #
    # 45-minute buffer, raised from an original 20 on 2026-07-16 for the
    # local sentence-transformers embedding workload's real costs at the
    # time (per-item embed loop batching, and SentenceTransformer's
    # model-load network round-trips to huggingface.co). The NVIDIA NIM
    # swap (2026-07-19) removes that specific cost entirely -- embeddings
    # are now real API calls (live-measured: a 50-item batch in ~1.4s),
    # not a local model load -- but 45 is left as-is rather than lowered
    # on a guess: no real post-swap Saturday run has completed yet to
    # measure the new real duration against. Revisit with real evidence
    # once one has.
    timeout-minutes: 45
    env:
      PYTHONPATH: "."
      DB_URI: ${{ secrets.DB_URI }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
      TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
      TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
      LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # actions/cache@v4's save only runs as a POST step, which GitHub Actions
      # only executes if the job reaches a "completed" state -- a job
      # cancelled by timeout-minutes is an external termination, not a
      # completion, so the save is silently skipped (confirmed via GitHub's
      # own community discussions on this exact behavior -- 2026-07-17,
      # after a real Saturday run timeout gave the cold-cache cost no chance
      # to ever get paid off). Explicit restore/save sub-actions instead,
      # with save placed right after the cache is actually populated (pip
      # install), well before the long, timeout-risking main step -- so a
      # later timeout can no longer prevent the cache from ever being saved.
      - name: Restore pip cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Save pip cache
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      # discovery/config/agentmail_sources.yaml is gitignored (real inbox_id +
      # real sender addresses -- see discovery/agentmail_sources_config.py's
      # module docstring), so it doesn't exist in this fresh checkout.
      # Reconstructed here from the AGENTMAIL_SOURCES_YAML secret, same
      # pattern as every other credential in this workflow (secret ->
      # env/file, never committed). Set as a step-scoped env var rather than
      # interpolated directly into the run: string, so YAML content
      # containing quotes/colons/etc. can't break shell parsing. Saturday-only
      # step -- fetch_agentmail_sources() early-returns for source_context !=
      # "saturday", so daily.yml/poll.yml have no use for this file.
      - name: Write AgentMail sources config
        env:
          AGENTMAIL_SOURCES_YAML: ${{ secrets.AGENTMAIL_SOURCES_YAML }}
        run: printf '%s\n' "$AGENTMAIL_SOURCES_YAML" > discovery/config/agentmail_sources.yaml

      - name: Run Saturday pipeline
        # Output tee'd to a file (2026-07-19) so it can be uploaded as a
        # real downloadable artifact below -- GH Actions' bash steps
        # already run with pipefail on by default, so a real pipeline
        # failure still fails this step even though the output is piped
        # through tee, not just captured in the live/in-browser log.
        run: python scripts/run_saturday.py 2>&1 | tee saturday_run.log

      - name: Upload Saturday run log
        # if: always() -- not just on success -- since a real timeout-
        # cancelled run is exactly the case this exists for. Real, sourced
        # finding (2026-07-19): unlike actions/cache's save step (a POST
        # step, confirmed skipped entirely on a timeout-cancellation --
        # see the cache-restructuring fix above), a plain if: always()
        # step gets a real ~5-minute cancellation grace period during
        # which GitHub Actions attempts to run it before force-terminating
        # the job, so this SHOULD still capture a partial log from a run
        # that times out, not just a clean completion or a normal
        # exception failure. NOT YET independently confirmed against a
        # real triggered run of this exact workflow (community-sourced
        # finding, not this project's own direct observation yet) --
        # don't treat this as verified until a real run (ideally one that
        # actually times out) confirms the artifact appears with real
        # captured content.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saturday-run-log-${{ github.run_id }}
          path: saturday_run.log
          retention-days: 14

      # discovery/parsers/rss_common.py's fetch_rss_feed() dumps the raw
      # response body to logs/parse_errors/ on an XML ParseError (see
      # _dump_parse_error_body) -- the only way to get byte-level proof of
      # a malformed feed (MarkTechPost's "not well-formed (invalid
      # token)" has hit twice with no local repro). That directory only
      # exists on the runner's disk, which is destroyed at job end, so it
      # has to be uploaded as an artifact to survive and be downloadable
      # from the run's summary page. Most runs won't have any parse
      # errors at all, so upload-artifact@v4's own path-must-match-a-file
      # requirement would otherwise fail this step on every clean run --
      # explicitly checked first so the step no-ops instead of erroring
      # when the directory is empty or was never created.
      - name: Check for RSS parse-error dumps
        id: check_parse_errors
        if: always()
        run: |
          if [ -d logs/parse_errors ] && [ -n "$(ls -A logs/parse_errors 2>/dev/null)" ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload RSS parse-error dumps
        if: always() && steps.check_parse_errors.outputs.has_files == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rss-parse-errors-${{ github.run_id }}
          path: logs/parse_errors/
          retention-days: 14
