name: Telegram Poll

on:
  schedule:
    # 16:30 UTC = 22:00 IST (2026-07-18, moved from 03:00 UTC/08:30 IST --
    # no stated reason found in git history for the original 08:30 IST time,
    # just carried over from whenever this workflow was first written), every
    # day including Saturday -- unlike daily.yml (which skips Saturday), this
    # must run all 7 days: approval resumes, ad-hoc queuing, and digest/plan
    # feedback can all arrive on any day.
    - cron: "17 * * * *"
  repository_dispatch:
    types: [telegram-update]
  workflow_dispatch:

concurrency:
  group: telegram-poll
  cancel-in-progress: false

jobs:
  run-poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      DB_URI: ${{ secrets.DB_URI }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
      TELEGRAM_INBOX_MODE: "true"
      TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
      TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
      TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
      LANGSMITH_TRACING: "true"
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: weekly-intel-prod
      LANGCHAIN_HIDE_INPUTS: "true"
      LANGCHAIN_HIDE_OUTPUTS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Poll Telegram for resumes/feedback/ad-hoc input
        run: uv run python scripts/run_poll.py
