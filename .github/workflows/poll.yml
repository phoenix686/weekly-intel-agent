name: Telegram Poll

on:
  schedule:
    # 16:30 UTC = 22:00 IST (2026-07-18, moved from 03:00 UTC/08:30 IST --
    # no stated reason found in git history for the original 08:30 IST time,
    # just carried over from whenever this workflow was first written), every
    # day including Saturday -- unlike daily.yml (which skips Saturday), this
    # must run all 7 days: approval resumes, ad-hoc queuing, and digest/plan
    # feedback can all arrive on any day.
    - cron: "30 16 * * *"
  workflow_dispatch:

concurrency:
  group: telegram-poll
  cancel-in-progress: false

jobs:
  run-poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      DB_URI: ${{ secrets.DB_URI }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
      TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
      TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
      LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll Telegram for resumes/feedback/ad-hoc input
        run: python scripts/run_poll.py
