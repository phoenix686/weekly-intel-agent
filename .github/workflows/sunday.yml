name: Sunday Pipeline

on:
  schedule:
    # 13:30 UTC = 19:00 IST, Sunday.
    - cron: "30 13 * * 0"
  workflow_dispatch:

concurrency:
  group: sunday-pipeline
  cancel-in-progress: false

jobs:
  run-sunday:
    runs-on: ubuntu-latest
    # The interrupt() approval gate does NOT keep this job running -- each
    # proposal pauses on its own dedicated checkpointer thread in Postgres,
    # and the parent graph (this job) completes normally once every
    # proposal has been sent, regardless of whether any are still pending
    # approval. Resuming a paused proposal happens later, in a separate
    # process, via telegram/polling.py's poll_once() -- not by this job
    # staying alive. This is a safety net against a genuine hang, not a
    # wait for Telegram replies.
    #
    # Raised from 20 -> 45 (2026-07-16): the original 20 predates
    # Checkpoint 5's local CPU-based embedding workload (semantic dedup +
    # taste pre-filter) entirely -- it was sized for the interrupt/resume
    # design, not for this. A real run hit exactly 20:17 and got killed
    # mid-progress, not from a real error. Real local investigation found
    # two distinct costs this timeout now needs to absorb: (1) the
    # per-item embed_text() loop in dedupe_semantic/taste_prefilter was
    # fixed to batch via embed_texts() instead (measured ~3.4x faster,
    # 150 items: 3.05s -> 0.89s) -- real but small, a few seconds; (2) far
    # more significant, SentenceTransformer's model-load step makes a
    # chain of ~10-15 real network round-trips to huggingface.co checking
    # file revisions EVEN WHEN the model is already cached (measured
    # ~15s locally on a fast connection) -- on GitHub Actions' network
    # this could run considerably slower, and this is a one-time-per-run
    # cost regardless of item count. 45 is a starting-point buffer for
    # both, not a precisely-derived number -- adjust with a real
    # completed run's actual duration once one exists.
    timeout-minutes: 45
    env:
      PYTHONPATH: "."
      DB_URI: ${{ secrets.DB_URI }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
      TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
      TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
      LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache HuggingFace model weights (all-MiniLM-L6-v2)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-all-MiniLM-L6-v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Sunday pipeline
        run: python scripts/run_sunday.py
