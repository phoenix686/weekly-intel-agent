# Blog/newsletter/RSS source list for scrape_blogs (the single generic
# source-fetching node -- TLDR AI, Smol AI News, and Anthropic's dev blog
# used to be separate dedicated node files; all sources are RSS/HTML reads
# through this one config now). Each entry has a `name`, a `bucket`
# (daily | sunday), exactly one of `feed_url` (RSS/Atom, fetched via
# discovery/parsers/rss_common.py) or `scrape_url` (HTML fallback, only
# used by the Anthropic entry today via discovery/parsers/anthropic_blog.py),
# and an optional `fetch_limit` (max items fetched from that source per
# run -- falls back to fetch_one_source()'s own default of 30 when
# omitted, see discovery/parsers/scrape_blogs.py).
#
# bucket=daily entries fire on both daily and sunday invocations.
# bucket=sunday entries fire on sunday only. See
# discovery/parsers/scrape_blogs.py's fetch_blog_entries().
#
# fetch_limit set per-bucket (2026-07-17, deliberate volume reduction, not
# left at the prior blanket default of 30): daily-bucket sources get 15
# (fire on both daily and sunday invocations, so a higher cap there costs
# more twice); sunday-only sources get 6 (weekly-or-slower cadence --
# these publications rarely post more than a handful of new items in a
# week, so 30 was always fetching mostly items seen_items would filter
# out anyway).
#
# All entries live-verified 2026-07-15 (real fetch, not assumed from prior
# commits) via discovery/parsers/rss_common.py's fetch_rss_feed(). Part 7
# sources were re-verified, not carried over on trust.
#
# Smol AI News removed entirely (2026-07-15, explicit instruction) --
# discovery/nodes/smol_ai_news.py deleted.
#
# DecodingML/DecodingAI: the original https://decodingml.substack.com/feed
# was found dead (valid but empty RSS channel, account renamed to a
# personal feed) and dropped 2026-07-15. Found and re-verified same day:
# the publication rebranded to "Decoding AI Magazine" at a custom domain,
# https://www.decodingai.com/feed -- live-verified, 10 real items
# returned, no errors.
#
# deeplearning.ai / The Batch intentionally excluded -- no public RSS feed,
# confirmed independently twice.
#
# JamWithAI, The Nuanced Perspective, AI with Aish, The Neural Maze (all
# Substack-hosted): currently unreachable specifically from GitHub Actions
# runners -- real production node_summary entries (2026-07-17) show all
# four failing with HTTP 403 Forbidden on every run, while the other 8
# sources' items still come through fine (items_out=26 both times) and the
# node completes normally, so this is a known, isolated, gracefully-handled
# failure, not a pipeline bug. Re-tested all four from a non-Actions
# machine and every one succeeded -- the 403 does not reproduce there, so
# this is most likely Substack rate-limiting/blocking GitHub's shared
# runner IP ranges rather than anything about the request itself (a
# browser-realistic User-Agent was already tried in
# discovery/parsers/rss_common.py and made no difference). Don't
# re-diagnose this as a new regression if it shows up again -- it's a
# standing, already-investigated condition. If Substack ever starts
# allowing these through again, or an alternative feed host is found, this
# note can be removed.

- name: "TLDR AI"
  feed_url: "https://tldr.tech/api/rss/ai"
  bucket: daily
  fetch_limit: 15

- name: "LangChain Blog"
  feed_url: "https://blog.langchain.dev/rss.xml"
  bucket: sunday
  fetch_limit: 6

- name: "JamWithAI"
  feed_url: "https://jamwithai.substack.com/feed"
  bucket: sunday
  fetch_limit: 6

