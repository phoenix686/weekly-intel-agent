# publication that was live on 2026-07-10. No working replacement URL
# found (decodingml.com does not resolve). Flag to Pooja if a new URL for
# this publication turns up.
#
# deeplearning.ai / The Batch intentionally excluded -- no public RSS feed,
# confirmed independently twice.

