# Blog/newsletter/RSS source list for scrape_blogs, the single generic
# source-fetching node. Each entry has a `name`, a `bucket` (daily |
# sunday), exactly one of `feed_url` (RSS/Atom, fetched via
# discovery/parsers/rss_common.py) or `scrape_url` (HTML fallback, only
# used by the Anthropic entry via discovery/parsers/anthropic_blog.py),
# and an optional `fetch_limit` (max items fetched per run -- falls back
# to fetch_one_source()'s own default of 30 when omitted, see
# discovery/parsers/scrape_blogs.py).
#
# `roundup: true` (feed_url entries only, currently only TLDR AI): the
# feed itself carries zero real content, only issue-level discovery
# (title/link/pubDate); real content lives on each issue's own linked
# page, itself a multi-item roundup. Routed through
# discovery/parsers/tldr_ai.py's fetch_tldr_roundup() instead of the
# plain fetch_rss_feed() path -- see that module's docstring.
#
# bucket=daily entries fire on both daily and sunday invocations.
# bucket=sunday entries fire on sunday only. See
# discovery/parsers/scrape_blogs.py's fetch_blog_entries().
#
# fetch_limit is set per-bucket: daily-bucket sources get 15 (fire on
# both daily and sunday invocations, so a higher cap there costs more
# twice); sunday-only sources get 6 (weekly-or-slower cadence -- these
# publications rarely post more than a handful of new items in a week).
#
# deeplearning.ai / The Batch is intentionally excluded -- no public RSS
# feed.
#
# 10 sources (including Decoding AI Magazine, JamWithAI, The Nuanced
# Perspective, AI with Aish, The Neural Maze, and others) are read AS
# EMAIL via a single shared AgentMail inbox instead of RSS, and are
# deliberately NOT entries in this file -- it's a completely separate
# fetch path (discovery/parsers/scrape_blogs.py's
# fetch_agentmail_sources(), called directly by discovery/nodes/
# scrape_blogs.py alongside, not through, this file's per-entry loop).
# The real inbox ID and sender-address-to-source-name mapping live in
# discovery/config/agentmail_sources.yaml -- gitignored (personal
# subscription data, same category as .env), with a tracked
# agentmail_sources.yaml.example documenting the expected shape.

- name: "TLDR AI"
  feed_url: "https://tldr.tech/api/rss/ai"
  bucket: daily
  fetch_limit: 15
  # roundup: true (2026-07-22, real fix): TLDR's RSS carries zero
  # <description>/<content:encoded> (confirmed live) -- real content only
  # exists on each issue's own https://tldr.tech/ai/{date} page, itself a
  # multi-item roundup (19 unrelated blurbs/sections on the 2026-07-21
  # issue), not a single article. discovery/parsers/tldr_ai.py's
  # fetch_tldr_roundup() fetches the RSS for issue-level discovery only,
  # then fetches+parses each surviving issue's own page into its
  # individual blurbs. fetch_limit still bounds how many ISSUES stage 1
  # considers, same as any other feed_url entry.
  roundup: true

- name: "LangChain Blog"
  feed_url: "https://blog.langchain.dev/rss.xml"
  bucket: sunday
  fetch_limit: 6

- name: "Latent Space"
  feed_url: "https://www.latent.space/feed"
  bucket: daily
  fetch_limit: 15

- name: "Anthropic Engineering Blog"
  scrape_url: "https://www.anthropic.com/engineering"
  bucket: sunday
  fetch_limit: 6

- name: "MarkTechPost"
  feed_url: "https://www.marktechpost.com/feed/"
  bucket: daily
  fetch_limit: 15

- name: "The New Stack (AI)"
  feed_url: "https://thenewstack.io/ai/feed/"
  bucket: daily
  fetch_limit: 15

- name: "Technically"
  feed_url: "https://read.technically.dev/feed"
  bucket: sunday
  fetch_limit: 6
  # Moved from daily to sunday, 2026-07-22: publishes weekly (Tuesdays),
  # so a 48h daily cutoff structurally returns ~0-1 items most days --
  # fits the weekly Sunday digest's cadence, not daily's. fetch_limit
  # dropped from 15 to 6 to match every other sunday-only source's
  # weekly-or-slower convention (see this file's header comment).

- name: "Hacker News (Show HN)"
  feed_url: "https://hnrss.org/show"
  bucket: sunday
  fetch_limit: 8
  # Deliberately NO keyword query filter on the fetch
  # itself (hnrss.org supports one, e.g. hnrss.org/show?q=agent, but using
  # it would reintroduce the exact keyword-matching brittleness this
  # project moved away from -- semantic scoring, not keyword matching, is
  # how every other source works). Pulls every Show HN submission broadly;
  # discovery/nodes/score.py's TASTE_PROFILE has an explicit Hacker-News-
  # specific tagging instruction (identify via the "Show HN:" title prefix
  # -- hnrss.org's own url field is the submitter's external link, not a
  # news.ycombinator.com URL) so new-tool-launch only gets assigned to
  # genuine AI/agent tool launches, not general discussion or unrelated
  # Show HN posts, the same way MarkTechPost's higher volume is handled by
  # scoring, not by narrowing the fetch.
